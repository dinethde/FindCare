services:
  household-service:
    build: .
    container_name: household-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/household"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "postgres"
    depends_on:
      - postgres
    networks:
      - household-network

  postgres:
    image: postgres:15
    container_name: household-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: household
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - household-network

volumes:
  postgres-data:
    driver: local

networks:
  household-network:
    driver: bridge
