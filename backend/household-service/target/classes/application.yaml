spring:
  application:
    name: household-service

  datasource:
    url: "jdbc:postgresql://postgres:5432/household"
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

