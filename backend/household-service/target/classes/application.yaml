spring:
  application:
    name: household-service

  datasource:
    url: "jdbc:postgresql://fc-household-db-dev.postgres.database.azure.com:5432/household?sslmode=require"
    username: "householddbadmin"
    password: "Findcare_admin_pwd"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: true
