# ========== Azure Production setup ==========
services:
  caregiver-service:
    build: .
    container_name: caregiver-service
    ports:
      - "8082:8082"
    volumes:
      - ../../db/migration:/app/db/migration # Add this volume mount
    environment:
      SPRING_APPLICATION_NAME: "caregiver-service"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://fc-tenant-db-dev.postgres.database.azure.com:5432/tenantdb?sslmode=require"
      SPRING_DATASOURCE_USERNAME: "adminTenantDb"
      SPRING_DATASOURCE_PASSWORD: "Findcare_MAIN_pwd"
      SPRING_FLYWAY_ENABLED: true
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: true
      SERVER_PORT: 8082
      SPRING_FLYWAY_LOCATIONS: filesystem:/app/db/migration
