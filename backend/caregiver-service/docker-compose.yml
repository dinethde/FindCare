version: "3.8"
services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_DB: tenantdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root123
      POSTGRES_HOST_AUTH_METHOD: trust
    command: >
      bash -c "
        if ! pg_isready -h localhost -p 5432 -U admin -d tenantdb; then
          docker-entrypoint.sh postgres &
          sleep 10
          psql -U admin -d postgres -c 'CREATE DATABASE tenantdb;'
        fi
        docker-entrypoint.sh postgres
      "
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  agency-service:
    build: .
    container_name: caregiver-service
    ports:
      - "8082:8082"  # Map container's 8081 to host's 8081
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tenantdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_FLYWAY_ENABLED: true
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: true
      SERVER_PORT: 8082  # Set Spring Boot to use port 8081
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
