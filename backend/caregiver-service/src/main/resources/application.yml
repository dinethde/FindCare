spring:
  application:
    name: caregiver-service

  datasource:
    url: jdbc:postgresql://findcare-postgres:5432/tenantdb
    username: admin
    password: root123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none # Changed from validate to none
    show-sql: true
    properties:
      jakarta.persistence.schema-generation.database.action: none
    defer-datasource-initialization: true

  flyway:
    enabled: true
    locations: filesystem:d:/SDGP/development/FindCare/db/migration
    baseline-on-migrate: true
    baseline-version: 0
    schemas: public
    validate-on-migrate: false

logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8082
