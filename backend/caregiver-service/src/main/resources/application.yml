server:
  port: 8082

spring:
  application:
    name: caregiver-service

  # Primary datasource for JPA
  datasource:
    url: jdbc:postgresql://tenant-db.postgres.database.azure.com:5432/household?sslmode=require
    username: dbhousehold
    password: Findcare_householdDb

  # Explicitly disable JPA schema generation
  jpa:
    hibernate:
      ddl-auto: none
    # properties:
    #   hibernate:
    #     dialect: org.hibernate.dialect.PostgreSQLDialect
    #     hbm2ddl.auto: none
    # # Turn off schema validation entirely
    # database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  # Configure Flyway without JPA dependency
  flyway:
    enabled: true
    locations: filesystem:/app/db/migration
    baseline-on-migrate: true
    # No dependency on EntityManagerFactory
    # url: jdbc:postgresql://findcare-postgres:5432/tenantdb
    # user: admin
    # password: root123
    # baseline-version: 0
    # schemas: public
    # validate-on-migrate: false

logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8081
