server:
  port: 8082

spring:
  application:
    name: caregiver-service

  # Master datasource for tenant management
  datasource:
    master:
      url: jdbc:postgresql://findcare-postgres:5432/master_db
      username: admin
      password: root123
      driver-class-name: org.postgresql.Driver
      hikari:
        minimum-idle: 5
        maximum-pool-size: 20
        idle-timeout: 30000
        max-lifetime: 2000000
        connection-timeout: 30000
        pool-name: MasterHikariPool

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false  # We will initialize tenants using the agency-service

logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    com.findcare.caregiver.multitenancy: DEBUG

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8082