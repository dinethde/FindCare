server:
  port: 8082

spring:
  application:
    name: household-service

  datasource:
    url: "jdbc:postgresql://fc-tenant-db-dev.postgres.database.azure.com:5432/tenantdb?sslmode=require"
    username: "adminTenantDb"
    password: "Findcare_MAIN_pwd"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

  flyway:
    enabled: true
    locations: filesystem:/app/db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: true
