spring:
  application:
    name: agency-service

  # Primary datasource for JPA
  datasource:
    url: jdbc:postgresql://findcare-postgres:5432/tenantdb
    username: admin
    password: root123
    driver-class-name: org.postgresql.Driver

  # Explicitly disable JPA schema generation
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl.auto: none
    # Turn off schema validation entirely
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  # Configure Flyway without JPA dependency
  flyway:
    enabled: true
    # No dependency on EntityManagerFactory
    url: jdbc:postgresql://findcare-postgres:5432/tenantdb
    user: admin
    password: root123
    locations: filesystem:/app/db/migration
    baseline-on-migrate: true
    baseline-version: 0
    schemas: public
    validate-on-migrate: false

logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8081
