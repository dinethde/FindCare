services:
  postgres:
    image: postgres:latest
    container_name: findcare-postgres
    environment:
      POSTGRES_DB: tenantdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - shared-db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  shared-db-network:
    name: findcare-network
    driver: bridge

volumes:
  postgres-data:
    name: findcare-postgres-data