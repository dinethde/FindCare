server:
  port: 8081

spring:
  application:
    name: agency-service

  # Master datasource for tenant management
  datasource:
    master:
      url: jdbc:postgresql://findcare-postgres:5432/master_db
      username: admin
      password: root123
      driver-class-name: org.postgresql.Driver
      hikari:
        minimum-idle: 5
        maximum-pool-size: 20
        idle-timeout: 30000
        max-lifetime: 2000000
        connection-timeout: 30000
        pool-name: MasterHikariPool

  # Explicitly disable JPA schema generation
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl.auto: none
    # Turn off schema validation entirely
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  # Configure Flyway for master database
  flyway:
    enabled: true
    # No dependency on EntityManagerFactory
    url: jdbc:postgresql://findcare-postgres:5432/master_db
    user: admin
    password: root123
    locations: classpath:db/migration/master
    baseline-on-migrate: true
    baseline-version: 0
    schemas: public
    validate-on-migrate: false

logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    com.findcare.agency.multitenancy: DEBUG

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8081

  tenant:
    # Default database connection properties for new tenant databases
    default-datasource:
      url-template: jdbc:postgresql://findcare-postgres:5432/{database}
      username: admin
      password: root123