# ======== Multi db test ========
services:
  postgres:
    image: postgres:14
    container_name: tenant-service-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tenant_management
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount master migrations for initial setup
      - ../../db/migration/master:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 3

  tenant-service-app:
    build:
      context: .  # Set context to parent directory to access db files
      dockerfile: Dockerfile
    container_name: tenant-service-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tenant_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_FLYWAY_ENABLED: 'true'
      SPRING_FLYWAY_LOCATIONS: 'classpath:db/migration/master'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: