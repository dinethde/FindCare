# ======== Multi db test ========
spring:
  # Master datasource configuration for tenant management
  datasource:
    url: jdbc:postgresql://postgres:5432/tenant_management
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  # Flyway configuration for master database
  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-before-migrate: true
    locations: classpath:app/db/migration/master

# Tenant configuration
tenant:
  datasource:
    url-base: jdbc:postgresql://postgres:5432/
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    pool:
      max-size: 5
      min-idle: 2
      max-lifetime: 300000

server:
  port: 8080
